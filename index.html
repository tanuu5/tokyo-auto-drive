    (x,y)=>{warm(x,y,'#fbf7f1','#e9e1d4');g.fillStyle='#39383c';for(let k=0;k<3;k++){const xx=x+50+k*72;g.beginPath();g.arc(xx,y+34,9,0,7);g.fill();g.fillRect(xx-14,y+45,28,50);g.fillStyle=['#b8574b','#3e5a7a','#c8a24a'][k];g.fillRect(xx-14,y+50,28,30);g.fillStyle='#39383c';}frame(x,y,'#1f1f22');},
    (x,y)=>{warm(x,y,'#eef5fb','#c9d8e6');g.fillStyle='#2b3a48';g.fillRect(x+cw*.35,y+ch*.62,cw*.3,ch*.3);g.fillStyle='rgba(30,40,50,.7)';for(let k=0;k<=8;k++){g.fillRect(x+k*cw/8-1.5,y,3,ch);}g.fillRect(x,y+ch*.2,cw,3);frame(x,y,'#1f2a33');},

    (x,y)=>{for(let v=0;v<2;v++){const xx=x+v*128;g.fillStyle=['#f4f6f8','#d62d3a'][v];g.fillRect(xx+2,y,124,ch);g.fillStyle='#fff';g.fillRect(xx+10,y+8,108,74);for(let rr=0;rr<3;rr++){for(let k=0;k<7;k++){g.fillStyle=`hsl(${Math.floor(r()*360)},70%,${40+r()*25}%)`;g.fillRect(xx+14+k*15,y+13+rr*24,10,18);}}g.fillStyle='#2a2d31';g.fillRect(xx+10,y+92,108,26);g.fillStyle='#e6e8ea';g.fillRect(xx+90,y+96,20,6);}},

const hud=$('hud');
function refreshPresetButtons(){for(const pr of PRESETS){let h=clockH;if(h<pr.range[0])h+=24;const on=h>=pr.range[0]&&h<pr.range[1];$(pr.id).setAttribute('aria-pressed',on?'true':'false');}}
function phaseName(h){if(h<4)return '深夜';if(h<6)return '夜明け前';if(h<10)return '朝';if(h<16)return '昼';if(h<17.3)return '夕方前';if(h<18.6)return '夕方';if(h<23)return '夜';return '深夜';}
PRESETS.forEach(pr=>{$(pr.id).addEventListener('click',()=>setPreset(pr.h));});
$('auto').addEventListener('click',()=>{autoTime=!autoTime;$('auto').setAttribute('aria-pressed',String(autoTime));});
['cabin','chase','cinema'].forEach(m=>{$('c-'+m).addEventListener('click',()=>setCam(m));});
function setCam(m){camMode=m;['cabin','chase','cinema'].forEach(k=>$('c-'+k).setAttribute('aria-pressed',String(k===m)));egoUpper.visible=m!=='cabin';egoLower.visible=m!=='cabin';cabin.visible=m==='cabin';camInit=true;}
function setUI(show){hud.classList.toggle('off',!show);$('showui').hidden=show;}
$('hide').addEventListener('click',()=>setUI(false));$('showui').addEventListener('click',()=>setUI(true));
window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
  if(k==='1')setPreset(6.8);else if(k==='2')setPreset(17.75);else if(k==='3')setPreset(22.5);
  else if(k==='t'){$('auto').click();}else if(k==='c'){const order=['cabin','chase','cinema'];setCam(order[(order.indexOf(camMode)+1)%3]);}
  else if(k==='h'){setUI(hud.classList.contains('off'));}else if(k===' '){e.preventDefault();paused=!paused;$('paused').hidden=!paused;}});

/* ============================================================
   カメラ
   ============================================================ */
let camInit=true;const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();
function updateCamera(dt,t){
  const ex=ego.x,ez=ego.z;let fov=66;const tp=new THREE.Vector3(),tl=new THREE.Vector3();
  if(camMode==='cabin'){fov=64;const bob=REDUCED?0:Math.sin(t*1.7)*.008+(ego.v>.5?Math.sin(t*9)*.004:0);const pitch=REDUCED?0:clamp(-ego.a*.012,-.05,.05);
    tp.set(ex+.38,1.3+bob,ez-.05);tl.set(ex+.25,1.1+pitch*10-0.3,ez-30);camera.position.copy(tp);camera.lookAt(tl);}
  else if(camMode==='chase'){fov=60;tp.set(ex+.2,2.55,ez+7.6);tl.set(ex,1.15,ez-8);
    if(camInit){camPos.copy(tp);camLook.copy(tl);}camPos.lerp(tp,1-Math.exp(-dt*4));camLook.lerp(tl,1-Math.exp(-dt*6));camera.position.copy(camPos);camera.lookAt(camLook);}
  else{fov=48;const a=t*.07;tp.set(clamp(ex+Math.sin(a)*10,-7.2,7.2),3.2+Math.sin(t*.13)*1.6,ez+Math.cos(a)*13);tl.set(ex,1.2,ez-2);
    if(camInit){camPos.copy(tp);camLook.copy(tl);}camPos.lerp(tp,1-Math.exp(-dt*2));camLook.lerp(tl,1-Math.exp(-dt*4));camera.position.copy(camPos);camera.lookAt(camLook);}
  camInit=false;if(Math.abs(camera.fov-fov)>.01){camera.fov=fov;camera.updateProjectionMatrix();updateGlowScale();}
}
function updateGlowScale(){const h=renderer.domElement.height;glowMat.uniforms.uScale.value=h/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));}
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();updateGlowScale();}
window.addEventListener('resize',resize);resize();

/* ============================================================
   環境の適用
   ============================================================ */
function applyEnv(t){
  sampleEnv(clockH);const E=ENV;
  skyMat.uniforms.uTop.value.copy(E.top);skyMat.uniforms.uHor.value.copy(E.hor);skyMat.uniforms.uBot.value.copy(E.bot);skyMat.uniforms.uGlow.value.copy(E.glow).multiplyScalar(.6);skyMat.uniforms.uStar.value=E.star;
  scene.fog.color.copy(E.fog);scene.fog.near=E.fn;scene.fog.far=E.ff;
  const sd=sunDirFor(clockH);const dayLight=sd.el>0.01;
  if(sd.el>-.08){skyMat.uniforms.uSunDir.value.copy(sd.dir);skyMat.uniforms.uSunCol.value.copy(E.sun).multiplyScalar(clamp((sd.el+.08)*6,0,1));skyMat.uniforms.uSunSharp.value=1400;skyMat.uniforms.uSunHalo.value=.35;}
  else{skyMat.uniforms.uSunDir.value.copy(MOON);skyMat.uniforms.uSunCol.value.set(.9,.93,1).multiplyScalar(clamp((-sd.el-.08)*5,0,1)*.9);skyMat.uniforms.uSunSharp.value=5000;skyMat.uniforms.uSunHalo.value=.05;}
  const ldir=dayLight?sd.dir:MOON;sun.color.copy(E.sun);sun.intensity=E.sunI;
  sun.position.set(ego.x+ldir.x*200,ldir.y*200,ego.z+ldir.z*200-30);sun.target.position.set(ego.x,0,ego.z-30);
  hemi.color.copy(E.hs);hemi.groundColor.copy(E.hg);hemi.intensity=E.hi;
  renderer.toneMappingExposure=E.exp;
  for(const m of FAC_MATS)m.emissiveIntensity=E.win*1.5;
  MAT.shop.emissiveIntensity=.28+E.neon*.9;MAT.signH.emissiveIntensity=.12+E.neon*.95;MAT.signV.emissiveIntensity=.12+E.neon*1.15;
  MAT.lantern.emissiveIntensity=.3+E.neon*1.6;MAT.train.emissiveIntensity=.25+E.night*1.1;MAT.expSign.emissiveIntensity=.08+E.night*.25;
  MAT.poolLamp.opacity=E.night*.9;MAT.poolNeon.opacity=E.neon*.8;
  for(const c of chunks.values())for(const m of c.mats)m.emissiveIntensity=.05+E.night*.35;
  const blink=((t*.9)%1)<.5?1:.12;
  glowMat.uniforms.uK.value.set(E.night,E.neon,1,E.win);glowMat.uniforms.uK2.value.set(E.night*blink,0,0,0);
  glowMat.uniforms.uFogNear.value=E.fn;glowMat.uniforms.uFogFar.value=E.ff;
  const sk=new THREE.Color().copy(E.hor).lerp(E.top,.35).multiplyScalar(.62);skylineMat.color.copy(sk);
  towerMat.color.copy(new THREE.Color(1,1,1).lerp(sk,.55+E.night*.4));
  headLight.intensity=E.night>.25?2.6*E.night:0;
  return E;
}

/* ============================================================
   ループ
   ============================================================ */
let lastT=performance.now(),hudT=0,elapsed=0;
function frame(now){
  requestAnimationFrame(frame);
  const rawDt=Math.min(.5,(now-lastT)/1000);let dt=Math.min(.05,rawDt);lastT=now;elapsed+=dt;
  if(timeAnim){timeAnim.t+=rawDt;let k=Math.min(1,timeAnim.t/timeAnim.dur);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;clockH=(timeAnim.from+timeAnim.d*k)%24;if(timeAnim.t>=timeAnim.dur)timeAnim=null;}
  else if(autoTime&&!paused)clockH=(clockH+dt/30)%24;
  const sdt=paused?0:dt;simT+=sdt;
  if(sdt>0)updateTraffic(sdt);
  updateChunks(false);
  for(const c of chunks.values())for(const u of c.updaters)u(simT);
  egoGroup.position.set(ego.x,0,ego.z);
  const E=applyEnv(simT);
  // 動的な光
  dyn.n=0;const night=clamp((E.night-.15)/.6,0,1);
  vehLights(ego,ego.x,ego.z,0,night,true);
  for(const v of vehicles){if(!v.active)continue;v.mesh.position.set(v.x,0,v.z);vehLights(v,v.x,v.z,v.mesh.rotation.y,night,false);}
  for(const c of chunks.values()){const ix=c.ix;if(!ix)continue;const sm=sigMain(ix.p,simT),scx=sigCross(ix.p,simT);
    for(const hd of ix.heads){const st=hd.key==='main'?sm:scx;const idx=st==='G'?0:st==='Y'?1:2;
      hd.lamps.forEach((m,k)=>{m.material=k===idx?(idx===0?MAT.sigG:idx===1?MAT.sigY:MAT.sigR):MAT.sigOff;});
      const lm=hd.lamps[idx].position,col=SIG_COL[st];const kk=.35+E.night*.9;const fx=Math.sin(hd.ry)*.12,fz=Math.cos(hd.ry)*.12;
      dyn.push(lm.x+fx,lm.y,lm.z+fz,col.r*kk,col.g*kk,col.b*kk,1.1+E.night*.6,GK.ALWAYS);}}
  dyn.commit();
  // 歩行者
  for(let k=0;k<PED_N;k++){const pd=pedList[k];pd.z+=pd.dir*pd.spd*sdt;if(pd.z>ego.z+45||pd.z<ego.z-320)spawnPed(pd,false);
    pd.ph+=sdt*pd.spd*5.2;_o.position.set(pd.x,.15+Math.abs(Math.sin(pd.ph))*.04,pd.z);_o.rotation.set(0,pd.dir>0?0:Math.PI,Math.sin(pd.ph)*.03);_o.scale.set(1,pd.h,1);_o.updateMatrix();peds.setMatrixAt(k,_o.matrix);}
  peds.instanceMatrix.needsUpdate=true;
  updateCamera(dt,elapsed);
  sky.position.copy(camera.position);skyline.position.set(camera.position.x,0,camera.position.z);ground.position.x=camera.position.x;ground.position.z=camera.position.z;
  renderer.render(scene,camera);
  hudT-=dt;if(hudT<=0){hudT=.12;updateHUD();}
}
function updateHUD(){
  const hh=Math.floor(clockH),mm=Math.floor((clockH-hh)*60);$('clock').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  $('phase').textContent=phaseName(clockH);$('spd').textContent=String(Math.round(ego.v*3.6));
  const pl=planAt(Math.floor(-ego.z/L));const Z=ZONES[pl.zone];if(lastZone!==pl.zone){$('zone').textContent=Z.name;$('zoneEn').textContent=Z.en;if(lastZone){const pe=$('plate');pe.classList.remove('flash');void pe.offsetWidth;pe.classList.add('flash');}lastZone=pl.zone;}
  const nx=nextIX(ego.z,-1);if(nx){$('xname').textContent=nx.p.jp;$('xroman').textContent=nx.p.en.trim();$('xdist').textContent=Math.max(0,Math.round(nx.dist))+' m';
    const st=sigMain(nx.p,simT);$('sigdot').style.background=st==='G'?'#2fe0b8':st==='Y'?'#ffc21a':'#ff3a2a';}
  refreshPresetButtons();
}

/* ============================================================
   起動
   ============================================================ */
setCam('cabin');
updateChunks(true);
for(let k=0;k<3;k++)updateTraffic(.05);
requestAnimationFrame(t=>{lastT=t;frame(t);setTimeout(()=>$('loading').classList.add('done'),150);});
})();
</script>

</html>
